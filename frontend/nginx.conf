server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy every API call to the FastAPI container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # FastAPI's OpenAPI docs are reachable at /docs and /openapi.json.
    location = /docs { proxy_pass http://backend:8000/docs; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; }
}
